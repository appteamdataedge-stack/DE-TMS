<div class="uf">
  <span class="uf__message">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    This record requires checker authorization before becoming active
  </span>
  <div class="uf__actions">
    <button type="button" class="uf__cancel" (click)="onCancel()">Cancel</button>
    <button type="button" class="uf__draft" (click)="onSaveDraft()">Save as Draft</button>
    <button type="button" class="uf__submit" (click)="onSubmit()">
      Submit for Approval
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </button>
  </div>
</div>
