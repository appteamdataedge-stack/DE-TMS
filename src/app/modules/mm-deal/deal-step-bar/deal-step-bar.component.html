<div class="dsb">
  @for (step of steps; track step.n; let last = $last) {
    <div class="dsb__step dsb__step--{{ state(step.n) }}">
      <!-- Circle -->
      <div class="dsb__circle">
        @if (state(step.n) === 'complete') {
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        } @else {
          <span>{{ step.n }}</span>
        }
      </div>

      <!-- Label -->
      <div class="dsb__label">
        <span class="dsb__label-main">{{ step.label }}</span>
        <span class="dsb__label-sub">{{ step.sub }}</span>
      </div>
    </div>

    <!-- Connector line -->
    @if (!last) {
      <div class="dsb__line" [class.dsb__line--done]="state(step.n) === 'complete'"></div>
    }
  }
</div>
